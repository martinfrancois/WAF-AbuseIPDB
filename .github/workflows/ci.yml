name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install requirements
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test with coverage
        run: |
          coverage run -m unittest discover -v
          coverage report
